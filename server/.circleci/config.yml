version: 2.1

executors:
  node-executor:
    docker:
      - image: circleci/node:16 # Use the Node.js 16 Docker image
    working_directory: ~/repo

jobs:
  install_dependencies:
    executor: node-executor
    steps:
      - checkout # Check out the code from Git
      - run:
          name: Install Dependencies
          command: |
            npm install
            npm ci

  run_tests:
    executor: node-executor
    steps:
      - checkout # Check out the code from Git
      - run:
          name: Run Tests
          command: npm test

  deploy:
    docker:
      - image: circleci/python:3.8  # You can also use Node.js if needed for the deployment
    steps:
      - checkout
      - run:
          name: Set up SSH keys
          command: |
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H $DO_SERVER_IP >> ~/.ssh/known_hosts
      - run:
          name: Deploy to DigitalOcean
          command: |
            ssh -o StrictHostKeyChecking=no $DO_USER@$DO_SERVER_IP "cd /path/to/your/project && git pull origin master && npm install && pm2 restart your-app"

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - install_dependencies
      - run_tests:
          requires:
            - install_dependencies
      - deploy:
          requires:
            - run_tests
